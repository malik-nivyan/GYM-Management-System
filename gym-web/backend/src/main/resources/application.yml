server:
  port: 8080

spring:
  application:
    name: gym-backend
  datasource:
    url: ${GYM_DB_URL:jdbc:mysql://127.0.0.1:3306/dump?serverTimezone=UTC}
    username: ${GYM_DB_USER:root}
    password: ${GYM_DB_PASSWORD:nivyan}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    open-in-view: false

app:
  frontend-origin: ${GYM_FRONTEND_ORIGIN:http://localhost:5173}
  jwt:
    secret: ${GYM_JWT_SECRET:change-this-dev-secret-change-this-dev-secret}
    expiration-ms: ${GYM_JWT_EXPIRATION_MS:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info


